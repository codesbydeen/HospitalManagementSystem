<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Log in to your secure CareFlow patient portal."
    />
    <title>CareFlow | Patient login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/portal.css" />
  </head>
  <body data-portal-form="login">
    <header class="public-header">
      <a class="brand" href="registration-ehr-profile.html"
        ><span class="brand-mark">+</span><span>CareFlow</span></a
      >
      <nav class="public-nav">
        <a class="public-link" href="registration-ehr-profile.html">Home</a
        >
      </nav>
      <div class="top-actions">
        <a class="public-link" href="patient-register.html">Register</a>
      </div>
    </header>
    <main class="content-body portal-content">
      <div class="page-heading">
        <div>
          <h1>Welcome back</h1>
          <p>Log in to view your health information and appointments.</p>
        </div>
      </div>
      <form
        class="surface panel portal-form login-form"
        id="login-form"
        novalidate
      >
        <div class="field">
          <label for="email">Email address</label
          ><input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="160"
          />
        </div>
        <div class="field">
          <label for="password">Password</label
          ><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="72"
          />
        </div>
        <p
          class="portal-feedback"
          id="form-feedback"
          role="status"
          aria-live="polite"
        ></p>
        <div class="form-actions">
          <button class="primary-btn" type="submit">Log in</button>
        </div>
        <p class="portal-switch">
          New to CareFlow?
          <a class="link" href="patient-register.html">Create an account</a>
        </p>
      </form>
    </main>
    <script src="js/password-toggle.js"></script>
    <script src="js/portal-forms.js"></script>
  </body>
</html>
